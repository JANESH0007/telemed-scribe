[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "telemed-scribe"
version = "0.1.0"
description = "TeleMed-Scribe — AI-powered telemedicine transcription and clinical note generation"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require model inference (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring all models loaded",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "tests*"]
